[package]
name = "prolly-spike-run"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
freenet-prolly = { path = "../../../sdk/freenet-prolly" }
blake3 = "1"
wire = { path = "../../../sdk/craftworks-sdk/wire" }
freenet-stdlib = { version = "0.10.0", features = ["net"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
futures = "0.3"
anyhow = "1"
[profile.release]
opt-level = 3
