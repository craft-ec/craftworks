[package]
name = "prolly-spike-run"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
freenet-prolly = { git = "https://github.com/craft-ec/freenet-prolly", rev = "17d67d8" }
blake3 = "1"
wire = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "f079914" }
freenet-stdlib = { version = "0.10.0", features = ["net"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
futures = "0.3"
anyhow = "1"
[profile.release]
opt-level = 3
