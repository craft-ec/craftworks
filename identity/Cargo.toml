[package]
name = "craftworks-identity"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The IDENTITY delegate's rules (ARCHITECTURE §4): holds this device's key and signs records for it. Its entry the node runs is the `delegate` crate."

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1"
# The prompt's text, as the node reads it (a JSON string).
serde_json = "1"
blake3 = { version = "1", default-features = false }
# The Register's params and signed message: the ONE format a tail's signature covers (the tail is built on it).
craftec-register-contract = { workspace = true }
ed25519-dalek = { version = "=2.2.0", default-features = false }
# Sealing to a public key (the inbox; escrow): X25519 and XChaCha20-Poly1305, the same as the account's.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[dev-dependencies]
craftec-register-contract = { workspace = true, features = ["testing"] }
