[package]
name = "craftworks-wallet"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "THE WALLET CORE (docs/TOKEN.md §7c): the user's side of the token — builds and signs this account's entries on its device, collects what is owed it once final, keeps its cuts' proofs, and checks a payment is value. Pure: no network, no keys of its own."

[dependencies]
craftworks-token-contract = { path = "../contracts-src/token", default-features = false }
craftworks-idlog-contract = { path = "../contracts-src/idlog", default-features = false }
blake3 = "1"
# STEALTH chains (stealth.rs): the curve, and ed25519 signing with a derived scalar (hazmat).
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "precomputed-tables"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["hazmat", "alloc"] }
sha2 = { version = "0.10", default-features = false }
# The payments bags (stealth.rs): the bag's own cap.
craftworks-bag-contract = { path = "../contracts-src/bag", default-features = false }

[dev-dependencies]
craftworks-identity = { path = "../identity" }
