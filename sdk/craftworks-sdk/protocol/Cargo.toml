[package]
name = "protocol"
version = "0.1.0"
edition = "2021"
publish = false
description = "The SDK <-> engine protocol. Versioned from its first message, and served for every version still in use."

[dependencies]
# Nothing else. This crate is shared by a delegate's wasm and the browser
# SDK's wasm, and a dependency here is one BOTH of them carry — which is why
# a gate asserts neither the freenet client stack nor tokio is reachable
# from it. core-types is layer 0 (serde only): `FailWhy`, the ONE list of why a
# write `Failed`, crosses the wire as itself (sdk#500).
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
bincode = "1"
core-types = { path = "../core-types" }
