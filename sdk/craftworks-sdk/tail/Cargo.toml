[package]
name = "tail"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The writer's and reader's side of a Tail (ARCHITECTURE §1): build a delta, flush the tail into the prolly tree, read the tail then the tree. Pure: no I/O, no clock, no signing key."

[dependencies]
craftec-tail-contract = { workspace = true }
craftec-register-contract = { workspace = true }
freenet-prolly = { path = "../../freenet-prolly" }

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false }
craftec-register-contract = { workspace = true, features = ["testing"] }
