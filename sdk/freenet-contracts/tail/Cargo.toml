[package]
name = "craftec-tail-contract"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Tail: a writer's live head and write buffer, updated by signed deltas. ARCHITECTURE.md §1."

# Own workspace: own lockfile, so the wasm hash (= part of every tail's key) is stable.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
freenet-stdlib = { version = "0.10.0", features = ["contract"], optional = true }
blake3 = { version = "1", default-features = false }
# The Register's params, signed part and verifier, as a LIBRARY: one signature rule for both contracts.
# Pinned by path in this repo; a change there that moves the signed bytes moves this contract's hash too.
craftec-register-contract = { path = "../register", default-features = false, features = ["library"] }

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false }
craftec-register-contract = { path = "../register", default-features = false, features = ["library", "testing"] }

[features]
default = ["freenet-main-contract"]
freenet-main-contract = ["dep:freenet-stdlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
