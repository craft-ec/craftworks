[package]
name = "craftworks-beacon-contract"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "BEACON (docs/TOKEN.md §5a): the clock — a sequential blake3 chain anyone extends, each step's points published while recent, a sampled check in the contract, fraud proofs by anyone."

# Own workspace: own lockfile, so the wasm hash (= part of the beacon's id) is stable.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
freenet-stdlib = { version = "0.10.0", features = ["contract"], optional = true }
blake3 = { version = "1", default-features = false }

[features]
default = ["freenet-main-contract"]
freenet-main-contract = ["dep:freenet-stdlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
