[package]
name = "craftworks-bag-contract"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "BAG: an unordered set of sealed items at an address, admitted by proof of work, no signer (an inbox)."

# Own workspace: own lockfile, so the wasm hash (= part of every block's contract id) is stable.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Only the contract itself (its entry points): its readers link without it (the identity delegate is on another stdlib).
freenet-stdlib = { version = "0.10.0", features = ["contract"], optional = true }
blake3 = { version = "1", default-features = false }

[features]
default = ["freenet-main-contract"]
freenet-main-contract = ["dep:freenet-stdlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
