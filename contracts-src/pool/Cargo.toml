[package]
name = "craftworks-pool-contract"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "A BATCH-AUCTION POOL (TOKEN §5): an app over the token's escrow — one contract per batch, its orders escrows, its verdict the batch's uniform-price clearing."

# Own workspace: own lockfile, so the wasm hash (= part of every batch's id) is stable.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
freenet-stdlib = { version = "0.10.0", features = ["contract"], optional = true }
craftworks-token-contract = { path = "../token", default-features = false }
craftworks-beacon-contract = { path = "../beacon", default-features = false }
blake3 = { version = "1", default-features = false }

[features]
default = ["freenet-main-contract"]
freenet-main-contract = ["dep:freenet-stdlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
