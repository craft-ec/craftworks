[workspace]
members = ["core", "identity", "publish"]
resolver = "2"

# THE SDK, pinned: only its proven parts are used — wire (the node's message format), page / page-io / engine (a
# site's publication through the node's signer), probe (a private node for a rehearsal). One revision for all.
[workspace.dependencies]
wire = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "615c9d5" }
page = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "615c9d5" }
page-io = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "615c9d5" }
engine = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "615c9d5" }
probe = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "615c9d5" }
core-types = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "615c9d5" }
pieces = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "615c9d5" }
tail = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "615c9d5" }
# The Register crate at the revision the SDK pins (one crate source).
craftec-register-contract = { git = "https://github.com/craft-ec/freenet-contracts", rev = "689ca61", default-features = false, features = ["library"] }
craftec-set-contract = { git = "https://github.com/craft-ec/freenet-contracts", rev = "689ca61", default-features = false }

[profile.release]
opt-level = "s"
lto = true
