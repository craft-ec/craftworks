[workspace]
members = ["core", "identity", "publish", "account", "mls", "feed", "gov", "data", "delegate", "files"]
# This repo's own contracts: each its own workspace and lockfile (the wasm hash is part of every instance's key).
exclude = ["contracts-src"]
resolver = "2"

# THE SDK, pinned: only its proven parts are used — wire (the node's message format), page / page-io / engine (a
# site's publication through the node's signer), probe (a private node for a rehearsal). One revision for all.
[workspace.dependencies]
wire = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "f079914" }
page = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "f079914" }
page-io = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "f079914" }
engine = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "f079914" }
probe = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "f079914" }
core-types = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "f079914" }
pieces = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "f079914" }
tail = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "f079914" }
contract-keys = { git = "https://github.com/craft-ec/craftworks-sdk", rev = "f079914" }
# The tree library at the revision the SDK pins (one crate source): a table's tree after a flush.
freenet-prolly = { git = "https://github.com/craft-ec/freenet-prolly", rev = "17d67d8" }
# The Register crate at the revision the SDK pins (one crate source).
craftec-register-contract = { git = "https://github.com/craft-ec/freenet-contracts", rev = "689ca61", default-features = false, features = ["library"] }

# CRAFTWORKS PATCHES (vendor/): mls-rs without forced browser randomness, mls-rs-core with a host clock — so MLS
# runs inside the identity delegate (no browser there: freenet-core #5747's wake-ups), and the page as before.
[patch.crates-io]
mls-rs = { path = "vendor/mls-rs-0.56.0" }
mls-rs-core = { path = "vendor/mls-rs-core-0.27.0" }

[profile.release]
opt-level = "s"
lto = true
