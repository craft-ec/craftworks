[package]
name = "craftworks-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The Craftworks app's one wasm package: the node's framing (wire), the identity delegate's questions, and the account (recovery words, DID)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wire = { workspace = true }
craftec-register-contract = { workspace = true }
serde_json = "1"
craftworks-identity = { path = "../identity" }
# The member Set's item format and reader: its ONE implementation.
craftec-set-contract = { workspace = true }
# A member's tail: the SDK's one client of the Tail contract.
tail = { workspace = true }
freenet-prolly = { workspace = true }
# A read repairs through parity with the SDK's one implementation (`engine::repair`: find a block's group, rebuild
# and verify it; the root's group of one). Pure: nothing in it reaches the network.
engine = { workspace = true }
# MLS (RFC 9420): the one key manager — your account's nodes, and every space's members. Runs in the page's core
# (JS randomness and clock are legitimate there); the identity delegate keeps the state and the epoch secrets.
mls-rs = { version = "=0.56.0", default-features = false, features = ["std", "tree_index", "fast_serialize"] }
mls-rs-crypto-rustcrypto = "=0.22.1"
mls-rs-core = "=0.27.0"
zeroize = "1"
freenet-stdlib = { version = "0.10.0", features = ["contract"] }
ed25519-dalek = { version = "=2.2.0", default-features = false }
blake3 = { version = "1", default-features = false }
# Recovery words (BIP39) and the owner key's derivation from them (SLIP-0010 ed25519 over HMAC-SHA512).
bip39 = { version = "2", default-features = false, features = ["alloc"] }
hmac = "0.12"
# The DID's text form: base58 of the owner key.
bs58 = "0.5"
# The account's key event log: its format and chain check, the ONE implementation (the contract's own crate).
craftworks-idlog-contract = { path = "../contracts-src/idlog", default-features = false }
# The account's encryption key (X25519) and its vault (XChaCha20-Poly1305).
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
js-sys = "0.3"

[dev-dependencies]
craftec-register-contract = { workspace = true, features = ["testing"] }
