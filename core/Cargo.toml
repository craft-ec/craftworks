[package]
name = "craftworks-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The Craftworks app's one wasm package: the node's framing (wire) and the signer's questions, nothing else."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wire = { workspace = true }
craftec-register-contract = { workspace = true }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
js-sys = "0.3"

[dev-dependencies]
craftec-register-contract = { workspace = true, features = ["testing"] }
