[package]
name = "craftworks-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The Craftworks app's one wasm package: the node's framing (wire), the identity delegate's questions, and the account records."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wire = { workspace = true }
craftec-register-contract = { workspace = true }
serde_json = "1"
craftworks-identity = { path = "../identity" }
freenet-stdlib = { version = "0.10.0", features = ["contract"] }
ed25519-dalek = { version = "=2.2.0", default-features = false }
blake3 = { version = "1", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
js-sys = "0.3"

[dev-dependencies]
craftec-register-contract = { workspace = true, features = ["testing"] }
