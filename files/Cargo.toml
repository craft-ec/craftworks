[package]
name = "craftworks-files"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "FILES (ARCHITECTURE §6): a file as encrypted 256 KiB chunks, RLNC-coded over GF(2^8) in generations of 16, each fragment at a key-derived address, an index of fragment hashes checked against the reference. Pure: the page (through the core) moves the bytes."

[dependencies]
blake3 = { version = "1", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
