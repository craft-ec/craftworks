[package]
name = "craftworks-delegate"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The IDENTITY DELEGATE the node runs (built as identity.wasm): the identity's rules (`craftworks-identity`) served to the pages, and UPKEEP with no page open (woken every minute): admitting askers into spaces."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The node's entry point, only in the wasm the node runs (build.sh turns it on). Native builds and tests export nothing.
default = []
freenet-main-delegate = []
# Named by the stdlib `#[delegate]` macro's cfg; unused here.
trace = []

[dependencies]
craftworks-identity = { path = "../identity" }
# 0.12: a delegate MANIFEST (periodic wake-ups, lifecycle events: freenet-core #5747). The contracts stay on theirs.
freenet-stdlib = { version = "0.12.1", features = ["contract"] }
serde_json = "1"
blake3 = { version = "1", default-features = false }
# UPKEEP: a table as a tail, a space's MLS group (its logic, not the page's bindings), the contracts' own readers.
craftworks-data = { path = "../data" }
craftworks-mls = { path = "../mls", default-features = false }
craftworks-bag-contract = { path = "../contracts-src/bag", default-features = false }
craftworks-idlog-contract = { path = "../contracts-src/idlog", default-features = false }
contract-keys = { workspace = true }
mls-rs-core = "=0.27.0"
craftworks-account = { path = "../account", default-features = false }
craftec-register-contract = { workspace = true }
ed25519-dalek = { version = "=2.2.0", default-features = false }
serde = { version = "1", features = ["derive"] }
bincode = "1"
# RE-KEY with no page open (R4): a space's tables read and merged (`table`), its sealed bags opened.
craftworks-feed = { path = "../feed" }
craftworks-gov = { path = "../gov" }
craftworks-files = { path = "../files" }
sha2 = { version = "0.10", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The delegate's randomness: upkeep's pool (the page stirs it), through getrandom's custom hook.
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
tail = { workspace = true }
