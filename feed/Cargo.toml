[package]
name = "craftworks-feed"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "FEEDS (the storage capability's wasm): a row as a version, and the causal merge of writers' feeds. Its own package."

[lib]
crate-type = ["cdylib", "rlib"]

# `js`: the page's bindings (its own package, built with them). Off for whatever links the merge into another wasm —
# the identity delegate: a delegate importing wasm-bindgen's host functions never instantiates on a node.
[features]
default = ["js"]
js = ["dep:wasm-bindgen", "dep:js-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.128", optional = true }
js-sys = { version = "0.3", optional = true }
