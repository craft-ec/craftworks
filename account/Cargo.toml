[package]
name = "craftworks-account"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The ACCOUNT (identity capability, pure): recovery words, the key log and its owner keys. Linked by the core and by mls, one source."

[dependencies]
wire = { workspace = true }
craftec-register-contract = { workspace = true }
craftworks-idlog-contract = { path = "../contracts-src/idlog", default-features = false }
freenet-stdlib = { version = "0.10.0", features = ["contract"] }
ed25519-dalek = { version = "=2.2.0", default-features = false }
blake3 = { version = "1", default-features = false }
bip39 = { version = "2", default-features = false, features = ["alloc"] }
hmac = "0.12"
sha2 = { version = "0.10", default-features = false }
bs58 = "0.5"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
