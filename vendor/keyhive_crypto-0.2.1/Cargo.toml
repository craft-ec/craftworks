[package]
name = "keyhive_crypto"
version = "0.2.1"
description = "Shared cryptographic primitives for Keyhive"

# VENDORED for Craftworks (keyhive @ 585e6fc, 2026-10-13; docs/proposals/members-and-keys-beekem.md): workspace values
# written out; keyhive_codec from vendor/.
authors = ["Alex Good <alex@memoryandthought.me>", "John Mumm <jtfmumm@gmail.com>", "Brooklyn Zelenka <hello@brooklynzelenka.com>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/inkandswitch/keyhive"
rust-version = "1.90.0"

[dependencies]
blake3 = { version = "1.5", default-features = false }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
derive_more = { version = "1.0", default-features = false, features = [
  "debug",
  "deref",
  "display",
  "from",
  "into",
  "try_into",
] }
ed25519-dalek = { version = "2.1", default-features = false, features = [
  "rand_core",
  "serde",
] }
future_form = "0.3.1"
futures = { version = "0.3.31", default-features = false, features = ["alloc"] }
keyhive_codec = { version = "0.1.0", path = "../keyhive_codec-0.1.0", default-features = false }
rand = { version = "0.8.5", default-features = false }
serde = { version = "1.0", default-features = false, features = [
  "alloc",
  "derive",
] }
signature = "2.2"
tracing = { version = "0.1.40", default-features = false, features = [
  "attributes",
] }
x25519-dalek = { version = "2.0", features = ["serde", "reusable_secrets", "static_secrets"] }

# std-only dependencies
bincode = { version = "1.3", optional = true }
dupe = { version = "0.9.0", optional = true }
thiserror = { version = "1.0", optional = true }

arbitrary = { version = "1.4.1", features = ["derive"], optional = true }

[features]
default = ["std"]
std = [
  "bincode",
  "blake3/std",
  "derive_more/std",
  "dupe",
  "ed25519-dalek/std",
  "keyhive_codec/std",
  "rand/std",
  "rand/std_rng",
  "serde/std",
  "serde/rc",
  "thiserror",
  "tracing/std",
]
arbitrary = ["dep:arbitrary", "std"]
# Everything the full test suite needs. Also the feature hosted CI and
# cargo-mutants pass to every crate: without it, `--features test_utils` fails
# to build this crate and its mutants are never tested.
test_utils = ["arbitrary"]

[lints.clippy]
doc_overindented_list_items = "allow"
