[package]
name = "craftworks-standing"
version = "0.1.0"
edition = "2021"
description = "STANDING (TOKEN §7a): what a node proves it holds where Freenet placed it — its ring location as the core computes it, attested by peers, and its holdings answered against the beacon."

[dependencies]
# A fixed list's positional proof (the holdings): the SDK's one, beside its tree.
freenet-prolly = { path = "../sdk/freenet-prolly" }
blake3 = { version = "1", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false }

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["rand_core"] }
